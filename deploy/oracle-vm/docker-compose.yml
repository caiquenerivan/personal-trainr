services:
  postgres:
    image: postgres:15-alpine
    container_name: personaltrainr_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: personaltrainr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: personaltrainr
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — only reachable by other containers on
    # this compose network (auth-service, workout-service).
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personaltrainr']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: personaltrainr_prod_auth
    restart: unless-stopped
    env_file: ./env/auth-service.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  workout-service:
    build:
      context: ../../apps/workout-service
      dockerfile: Dockerfile
    container_name: personaltrainr_prod_workout
    restart: unless-stopped
    env_file: ./env/workout-service.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    container_name: personaltrainr_prod_gateway
    restart: unless-stopped
    env_file: ./env/api-gateway.env
    depends_on: [auth-service, workout-service]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: personaltrainr_prod_caddy
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api-gateway]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
