name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/auth-service/**"
      - "apps/workout-service/**"
      - "apps/api-gateway/**"
      - "deploy/oracle-vm/**"
  workflow_dispatch:

concurrency:
  group: deploy-oracle-vm
  cancel-in-progress: false

jobs:
  # As imagens são construídas aqui (a VM de 1 GB levava mais de 20 min para buildar)
  # e publicadas no GitHub Container Registry; a VM só baixa e reinicia.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, workout-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/caiquenerivan/personaltrainr-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/caiquenerivan/personaltrainr-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script_stop: true
          command_timeout: 15m
          script: |
            cd ~/personal-trainr
            git fetch origin main
            git reset --hard origin/main
            cd deploy/oracle-vm
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull auth-service workout-service api-gateway
            docker compose up -d
            docker logout ghcr.io
            docker image prune -f
